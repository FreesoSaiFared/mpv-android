name: Morning Show Kotlin compile
on:
  push:
    branches: [feature/audio-first-morning-show]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDefaultDebugKotlin --no-daemon --console=plain
      - name: Package audio-recorder prototype APK
        run: ./gradlew :app:assembleDefaultDebug --no-daemon --console=plain
      - name: Inspect APK outputs
        run: find app/build/outputs/apk -type f -name '*.apk' -printf '%p %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: morning-show-audio-only-prototype
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
