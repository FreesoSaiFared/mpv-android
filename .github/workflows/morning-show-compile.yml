name: Morning Show Kotlin compile
on:
  push:
    branches: [feature/audio-first-morning-show]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDefaultDebugKotlin --no-daemon --console=plain
